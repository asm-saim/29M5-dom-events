<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Delegation</title>
</head>
<style>

</style>

<body>
    <section id="section-id">
        <h1>Topic: Event Delegation</h1>
        <ol id="all-item">
            <li class="item">Item number 1</li>
            <li class="item">Item number 2</li>
            <li class="item">Item number 3</li>
            <li class="item">Item number 4</li>
            <li class="item">Item number 5</li>
            <li class="item">Item number 6</li>
        </ol>
    </section>
    <button id="btn-id">Add new item</button>


    <script>
        // const items = document.getElementsByClassName('item');
        // for (let item of items) {
        //     item.addEventListener('click',
        //         function (event) {
        //             // deleting the clicked item
        //             event.target.parentNode.removeChild(event.target);
        //         })
        // }

        document.getElementById('all-item').addEventListener('click',
            function (event) {
                // console.log(event.target);
                event.target.parentNode.removeChild(event.target);
            }
        )

        //adding new item.
        document.getElementById('btn-id').addEventListener('click',
            function () {
                const callOl = document.getElementById('all-item');
                const newItem = document.createElement('li');
                newItem.classList.add('item');
                newItem.innerText = "Brand New Item";
                callOl.appendChild(newItem);
            }
        )

    </script>
</body>

</html>
