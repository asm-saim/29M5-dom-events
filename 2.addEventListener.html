<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Event Listener</title>

</head>

<body>
    <h1>addEventListener</h1>
    <!-- addEventListener for click-->
    <button id="colorOrange">Click here for orange bg</button>
    <br>
    <!-- addEventListener for Hover -->
    <button id="hoverHere">Hover Here</button>

    <script>
        document.getElementById('colorOrange').addEventListener('click',
            function orange() {
                document.body.style.backgroundColor = 'orange';
            }
        )

        // hover
        document.getElementById('hoverHere').addEventListener('mouseenter',
            function hover() {
                document.body.style.backgroundColor = 'red';
            }
        )
        document.getElementById('hoverHere').addEventListener('mouseleave',
            function leave() {
                document.body.style.backgroundColor = 'white';
            }
        )
    </script>
</body>

</html>
