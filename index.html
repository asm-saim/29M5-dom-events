<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Events</title>
</head>

<body>
    <h1>Hi, I am DOM-Events</h1>

    <!-- Inline HTML events (not-recommended)-->
    <button onclick="console.log(777)">Click Here</button>
    <button onclick="console.log(0)">Second click Here</button>
    <button onclick="console.log('hello')">Third click Here</button>
    <br>


    <!-- option 2: javaScript Event Property(using JS code) -->

    <button onclick="blue()">Click 2</button>
    <br>

    <!-- Option-3  -->
    <button id="click-id">This is Button 3</button>
    <button id="make-purple">This is Button 3 version 2</button>
    <br>

    <!-- Option- 4 addEventListener (Recommended) -->
    <button id="make-green">Make it green</button>

    <script>
        // getElementById.addEventListener('event type', handeler)
        document.getElementById('make-green').addEventListener('click',
            function greeny() {
                document.body.style.backgroundColor = 'green';
            }
        )

    </script>


    <script src="js/dom-events.js"></script>
</body>

</html>
